# Netlify configuration file
# This file is automatically read by Netlify when you deploy.

[[redirects]]
  from = "/api/cloudinary-signature"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "/api/delete-cloudinary"
  to = "/.netlify/functions/delete-cloudinary"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Clear the X-Frame-Options header to allow the site to be framed in previews
    X-Frame-Options = ""
    # Allow framing from Netlify, local hosts, and your specific AI Studio preview domains
    Content-Security-Policy = "frame-ancestors 'self' https://ais-pre-skdnreasgm2xhvmncrdpgs-526599491602.europe-west2.run.app https://ais-dev-skdnreasgm2xhvmncrdpgs-526599491602.europe-west2.run.app https://ai.studio https://*.google.com;"
    # Ensure index.html and other non-hashed assets are not cached
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Allow long-term caching for immutable hashed assets
    Cache-Control = "public, max-age=31536000, immutable"
